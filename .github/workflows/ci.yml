name: CI

on:
  pull_request:
    # A pull request that only adds Quest entries or a stance profile runs quests.yml instead.
    paths-ignore:
      - 'quests/entries/**'
      - 'quests/profiles/**'
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request cancels the run still going for the older one.
# Pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides what a pull request needs. Pushes to main always run everything.
  #   code:   false when only writing changed (*.md anywhere, docs/, licence files). Type check
  #           and tests still run, because tests check that generated docs match the code; the
  #           build, size check and browser tests are skipped.
  #   docker: true only when the image could change: Dockerfile, compose, deploy/, the server
  #           (server.ts, src/server, src/engine, src/platform), package files or this workflow.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      docker: ${{ steps.diff.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "docker=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE"...HEAD)
          echo "Changed files:"; echo "$files"
          code=false; docker=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|docs/*|LICENSE*|NOTICE|CITATION.cff) ;;
              *) code=true ;;
            esac
            case "$f" in
              Dockerfile|.dockerignore|docker-compose.yml|deploy/*|server.ts|src/server/*|src/engine/*|src/platform/*|package.json|package-lock.json|.github/workflows/ci.yml) docker=true ;;
            esac
          done <<< "$files"
          echo "code=$code docker=$docker"
          echo "code=$code" >> "$GITHUB_OUTPUT"; echo "docker=$docker" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: npm run build
      - name: Size check (web build may not grow; phone limits once the app build exists)
        if: needs.changes.outputs.code == 'true'
        run: npm run size:check
      # The browser download is kept between runs, keyed on the Playwright version.
      - name: Playwright version
        if: needs.changes.outputs.code == 'true'
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cached Chromium
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # The runner image already has Chrome's system libraries. --with-deps also apt-installs
      # font packages, and a slow Ubuntu mirror made that step run past the job limit twice on
      # 6 Nov 2026 before any test ran. With the cache above this finds Chromium and does nothing.
      - name: Install Chromium for the UI smoke test
        if: needs.changes.outputs.code == 'true'
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: UI smoke test (every page, all feeds down)
        if: needs.changes.outputs.code == 'true'
        run: npm run test:smoke
      - name: UI journeys (skip link, council chat, country sections, keys, sign-in)
        if: needs.changes.outputs.code == 'true'
        run: npm run test:journeys

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Home-server compose file is valid
        run: docker compose -f deploy/home-server/compose.yml config -q
      # Helm comes with the GitHub Ubuntu runner image.
      - name: Helm chart lints and renders (default, and with ingress + chart-made secret)
        run: |
          helm lint --strict deploy/helm/econquest
          helm template eq deploy/helm/econquest > /tmp/default.yaml
          helm template eq deploy/helm/econquest --set ingress.enabled=true --set ingress.host=eq.example.org \
            --set secret.values.ECONQUEST_SECRET_KEY=0123456789abcdef0123456789abcdef > /tmp/ingress.yaml
          grep -q 'kind: Deployment' /tmp/default.yaml
          grep -q 'value: "eq.example.org"' /tmp/ingress.yaml
          grep -q 'kind: Ingress' /tmp/ingress.yaml
          ! grep -q 'kind: Ingress' /tmp/default.yaml
      - name: Build the production image
        run: docker build -t econquest:ci .
      - name: Start it on an empty data volume and check it answers
        run: |
          docker run -d --name eq -p 127.0.0.1:3000:3000 -v eq-data:/app/data econquest:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/healthz && break; sleep 2; done
          curl -sf http://127.0.0.1:3000/healthz
          test "$(docker exec eq id -u)" = "1000"
          curl -sf -o /dev/null http://127.0.0.1:3000/
          curl -sf http://127.0.0.1:3000/readyz | grep -q '"ready":true'
      - name: Stops cleanly on docker stop
        run: |
          start=$(date +%s)
          docker stop eq
          test $(( $(date +%s) - start )) -lt 9
          docker logs eq 2>&1 | grep -q 'stopped cleanly'
      - name: Server log
        if: always()
        run: docker logs eq || true
