name: Quest entries

# Runs only on pull requests that add Quest entries (quests/entries/**) or stance profiles (quests/profiles/**). The time it runs is the
# entry's time: a push after entries close re-runs it and fails. Do not re-run it after close.
on:
  pull_request:
    paths:
      - 'quests/entries/**'
      - 'quests/profiles/**'

permissions:
  contents: read

jobs:
  entries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The checker comes from the base branch, never from the pull request, so a pull request
      # cannot change the rules it is checked by. The entry files are read from its head commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Fetch the pull request's commits
        run: git fetch --no-tags origin "refs/pull/${{ github.event.pull_request.number }}/head"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Check the entries
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          QUESTS_MAINTAINERS: ${{ vars.QUESTS_MAINTAINERS }}
        run: npm run -s quests:entries -- --pr
