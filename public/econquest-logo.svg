<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="eqShieldGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="55%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="eqGoldGrad" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <!-- Outer Institutional Octagonal Shield -->
  <polygon
    points="32,3 55,12 60,35 48,55 32,61 16,55 4,35 9,12"
    fill="url(#eqShieldGrad)"
    stroke="url(#eqGoldGrad)"
    stroke-width="2.5"
  />
  <!-- Inner Meridian Ring -->
  <circle cx="32" cy="32" r="19" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.65" />
  <!-- Global Latitude & Longitude Arcs -->
  <ellipse cx="32" cy="32" rx="10" ry="19" stroke="#60a5fa" stroke-width="1.1" stroke-opacity="0.55" />
  <line x1="13" y1="32" x2="51" y2="32" stroke="#60a5fa" stroke-width="1.1" stroke-opacity="0.55" />
  <line x1="32" y1="13" x2="32" y2="51" stroke="#60a5fa" stroke-width="1.1" stroke-opacity="0.55" />
  <!-- Quantitative Yield / Alpha Ascent Vector -->
  <polyline
    points="16,40 25,34 33,36 45,21"
    fill="none"
    stroke="url(#eqGoldGrad)"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <polygon points="48,18 41,20 46,25" fill="url(#eqGoldGrad)" />
  <!-- 3-Desk Sovereign Council Nodes (Geopolitical, Sovereign Credit, Macro) -->
  <circle cx="32" cy="13" r="3" fill="#f59e0b" stroke="#0f172a" stroke-width="1" />
  <circle cx="16" cy="41" r="3" fill="#38bdf8" stroke="#0f172a" stroke-width="1" />
  <circle cx="48" cy="41" r="3" fill="#10b981" stroke="#0f172a" stroke-width="1" />
  <!-- Central Supreme Council Compass Star -->
  <polygon points="32,24 34.4,29.6 40,32 34.4,34.4 32,40 29.6,34.4 24,32 29.6,29.6" fill="url(#eqGoldGrad)" />
</svg>
